<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>开发者小工具</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; color: #222; font-size: 13px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  .tabs { display: flex; gap: 4px; padding: 10px 12px 0; }
  .tab { padding: 6px 12px; border: 1px solid #ddd; border-bottom: 0; border-radius: 8px 8px 0 0; background: #f5f5f5; cursor: pointer; }
  .tab.active { background: #fff; border-color: #4f6ef7; color: #4f6ef7; font-weight: 600; }
  .main { flex: 1; display: flex; gap: 10px; padding: 12px; border-top: 1px solid #ddd; overflow: hidden; }
  .work { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  textarea { width: 100%; flex: 1; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: none; }
  input[type=text] { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 6px; align-items: center; }
  button { padding: 6px 12px; border: 0; border-radius: 6px; background: #4f6ef7; color: #fff; cursor: pointer; font-size: 12px; }
  button.ghost { background: #eee; color: #333; }
  #out { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre-wrap; overflow: auto; }
  .side { width: 180px; border-left: 1px solid #eee; padding-left: 10px; overflow: auto; }
  .side h4 { margin: 0 0 6px; font-size: 12px; color: #666; }
  .hist { padding: 5px 6px; border-radius: 5px; cursor: pointer; font-size: 11px; word-break: break-all; }
  .hist:hover { background: #eef2ff; }
  .hist .k { color: #4f6ef7; margin-right: 4px; }
  .err { color: #c62822; }
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active" data-tool="json">JSON 格式化</div>
    <div class="tab" data-tool="b64">Base64</div>
    <div class="tab" data-tool="url">URL 编解码</div>
    <div class="tab" data-tool="ts">时间戳</div>
  </div>
  <div class="main">
    <div class="work">
      <textarea id="in" placeholder="输入…"></textarea>
      <div class="row">
        <button id="run">转换</button>
        <button id="copy" class="ghost">复制结果</button>
        <button id="save" class="ghost">★ 收藏</button>
        <span id="hint" style="color:#888;font-size:11px"></span>
      </div>
      <div id="out">结果显示在这里</div>
    </div>
    <div class="side">
      <h4>收藏历史 <a href="#" id="clear" style="float:right;color:#c62822">清空</a></h4>
      <div id="hists"><div style="color:#aaa;font-size:11px">暂无</div></div>
    </div>
  </div>
<script>
  var tool = 'json';
  var lastOut = '';
  var $ = function (id) { return document.getElementById(id); };

  document.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      tool = t.dataset.tool;
      $('hint').textContent = '';
      $('out').textContent = '';
    };
  });

  function run() {
    var s = $('in').value;
    try {
      if (tool === 'json') {
        var obj = JSON.parse(s);
        lastOut = JSON.stringify(obj, null, 2);
      } else if (tool === 'b64') {
        lastOut = btoa(unescape(encodeURIComponent(s)));
      } else if (tool === 'url') {
        // 智能：含 % 则 decode，否则 encode
        lastOut = /%[0-9a-fA-F]{2}/.test(s) ? decodeURIComponent(s) : encodeURIComponent(s);
      } else if (tool === 'ts') {
        var n = Number(s);
        if (!n) throw new Error('请输入数字时间戳（秒或毫秒）');
        if (n < 1e12) n = n * 1000;
        lastOut = new Date(n).toLocaleString('zh-CN', { hour12: false }) + '  (' + n + ')';
      }
      $('out').classList.remove('err');
      $('out').textContent = lastOut;
    } catch (e) {
      $('out').classList.add('err');
      $('out').textContent = '错误：' + e.message;
    }
  }

  $('run').onclick = run;
  $('copy').onclick = function () {
    navigator.clipboard.writeText(lastOut || '');
    $('hint').textContent = '已复制';
  };
  $('save').onclick = function () {
    if (!lastOut) return;
    window.isbPanel.post({ type: 'history:push', kind: tool, text: lastOut.slice(0, 500) });
  };
  $('clear').onclick = function (e) { e.preventDefault(); window.isbPanel.post({ type: 'history:clear' }); };

  // 拉回历史
  window.isbPanel.post({ type: 'history:load' });
  window.isbPanel.on(function (msg) {
    if (!msg || msg.type !== 'history') return;
    var items = msg.items || [];
    var box = $('hists');
    if (!items.length) { box.innerHTML = '<div style="color:#aaa;font-size:11px">暂无</div>'; return; }
    box.innerHTML = '';
    items.forEach(function (it) {
      var d = document.createElement('div');
      d.className = 'hist';
      d.innerHTML = '<span class="k">' + it.kind + '</span>' + escapeHtml(it.text);
      d.title = it.text;
      d.onclick = function () { $('in').value = it.text; };
      box.appendChild(d);
    });
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
</script>
</body>
</html>
