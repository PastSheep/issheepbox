<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Is Sheep Box</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        display: flex; flex-direction: column; height: 100vh;
        background: #f5f5f5; color: #333;
      }
      /* 顶栏 */
      .topbar {
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px; background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      .topbar h1 { font-size: 16px; font-weight: 600; }
      .badge {
        font-size: 11px; padding: 2px 8px; border-radius: 10px;
        background: #e3f2fd; color: #1565c0;
      }
      .badge.safe { background: #fff3e0; color: #e65100; }
      /* 主区域 */
      .main { display: flex; flex: 1; overflow: hidden; }
      .sidebar {
        width: 260px; background: #fff; border-right: 1px solid #e0e0e0;
        overflow-y: auto; padding: 12px;
      }
      .sidebar h2 { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 8px; }
      .plugin-item {
        padding: 8px 10px; border-radius: 6px; margin-bottom: 4px;
        font-size: 13px; display: flex; align-items: center; gap: 8px;
      }
      .plugin-item.mounted { background: #e8f5e9; }
      .plugin-item.disabled { color: #999; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
      .dot.on { background: #4caf50; }
      .dot.off { background: #ccc; }
      /* 面板区 */
      .panel { flex: 1; padding: 24px; overflow-y: auto; }
      .panel-placeholder {
        display: grid; place-items: center; height: 100%;
        color: #aaa; font-size: 14px;
      }
      .failure-list { margin-top: 12px; }
      .failure-item {
        padding: 8px 10px; background: #ffebee; border-radius: 6px;
        font-size: 12px; color: #c62828; margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>Is Sheep Box</h1>
      <span class="badge" id="profile-name">加载中…</span>
      <span class="badge safe" id="safe-mode" style="display:none">安全模式</span>
    </div>
    <div class="main">
      <aside class="sidebar">
        <h2>已启用插件</h2>
        <div id="plugin-list"></div>
        <div class="failure-list" id="failure-list"></div>
      </aside>
      <div class="panel">
        <div class="panel-placeholder">面板占位 — 插件将在此渲染 UI</div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);

      function render(state) {
        $('profile-name').textContent = 'profile: ' + state.profileName;
        $('safe-mode').style.display = state.safeMode ? '' : 'none';

        const list = $('plugin-list');
        list.innerHTML = '';
        for (const id of state.enabled) {
          const mounted = state.mountedIds.includes(id);
          const item = document.createElement('div');
          item.className = 'plugin-item' + (mounted ? ' mounted' : ' disabled');
          item.innerHTML =
            '<span class="dot ' + (mounted ? 'on' : 'off') + '"></span>' +
            '<span>' + id + '</span>';
          list.appendChild(item);
        }

        const fl = $('failure-list');
        fl.innerHTML = '';
        for (const f of state.mountFailures || []) {
          const div = document.createElement('div');
          div.className = 'failure-item';
          div.textContent = f.pluginId + ': ' + f.error;
          fl.appendChild(div);
        }
      }

      window.shellAPI.onUiState(render);
      window.shellAPI.requestState();
    </script>
  </body>
</html>
